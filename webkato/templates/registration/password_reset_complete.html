{% extends 'website/base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4 text-success">
                    <i class="bi bi-check-circle" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold text-dark mb-3">Пароль изменен</h2>
                <p class="text-secondary">Ваш пароль был успешно изменен. Теперь вы можете войти в свой аккаунт.</p>
                <div class="d-grid gap-2 mt-4 pt-2 border-top">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-3 py-2">Войти в аккаунт</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'website/base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4 text-success">
                    <i class="bi bi-envelope-check" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold text-dark mb-3">Инструкция отправлена</h2>
                <p class="text-secondary">Мы отправили вам на почту инструкции по установке нового пароля. Если письмо не пришло, проверьте папку "Спам".</p>
                <div class="d-grid gap-2 mt-4 pt-2 border-top">
                    <a href="{% url 'home' %}" class="btn btn-outline-primary btn-lg rounded-3 py-2">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

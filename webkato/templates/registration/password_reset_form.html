{% extends 'website/base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary mb-1">Сброс пароля</h2>
                    <p class="text-secondary small">Введите ваш email, и мы отправим вам инструкцию по сбросу пароля</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label small fw-semibold text-secondary">Email адрес</label>
                        <input type="email" name="email" class="form-control rounded-3" id="id_email" placeholder="example@mail.kz" required>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 py-2">Отправить инструкцию</button>
                    </div>
                </form>
                <div class="text-center mt-4 pt-2 border-top">
                    <a href="{% url 'login' %}" class="text-decoration-none small text-muted hover-primary">Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

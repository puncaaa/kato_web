server {
    listen 80;
    server_name katokz.kz www.katokz.kz;

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias /var/www/katokz/staticfiles/;
    }

    location /media/ {
        alias /var/www/katokz/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}
